<!doctype html>
<html lang="de">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title id="title">Mein Wiki</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='70' font-size='65' font-weight='700' font-family='system-ui,sans-serif' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E"
  />

  <style>
    :root {
      --font:
        system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      --mono: SF Mono, Cascadia Code, Consolas, monospace;
      --size: 14px;
      --color: #1a1a1a;
      --bg: #fff;
      --sb-bg: #f5f5f5;
      --sb-w: 260px;
      --link: #2563eb;
      --btn: #2563eb;
      --btn-c: #fff;
      --btn-r: 6px;
      --bd: #e0e0e0;
      --focus: #2563eb;
      --ok: #16a34a;
      --err: #dc2626;
      --muted: #6b7280;
      --h-mg: 1rem 0 0.5rem;
      --h1: 1.8rem;
      --h2: 1.5rem;
      --h3: 1.3rem;
      --gap: 0.5rem;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      font-family: var(--font);
      font-size: var(--size);
      color: var(--color);
      background: var(--bg);
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    a.wl {
      border-bottom: 1px dotted var(--link);
    }
    a.wl::before {
      content: "📄 ";
      font-size: 0.8em;
    }
    a.wl:hover::after {
      content: " (Wiki-Seite)";
      font-size: 0.7em;
      color: var(--muted);
    }
    a[href^="http"]::after {
      content: " ↗";
      font-size: 0.7em;
    }
    button {
      cursor: pointer;
      font: inherit;
      font-size: inherit;
    }
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    input,
    textarea {
      font: inherit;
      font-size: inherit;
      border: 1px solid var(--bd);
      border-radius: var(--btn-r);
      padding: 8px 10px;
      width: 100%;
    }
    input:focus,
    textarea:focus {
      outline: 2px solid var(--focus);
      outline-offset: -1px;
      border-color: transparent;
    }

    /* Sidebar */
    #sb {
      width: var(--sb-w);
      background: var(--sb-bg);
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 10;
    }
    #sb header {
      padding: 1rem;
      border-bottom: 1px solid var(--bd);
    }
    #sb header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    #sb header h1 a {
      color: var(--color);
    }
    #sb #s-i {
      margin-top: 0.5rem;
    }
    #pl {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    #pl a {
      display: block;
      padding: 6px 1rem;
      color: var(--color);
      border-left: 3px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #pl a:hover,
    #pl a.act {
      background: rgba(0, 0, 0, 0.05);
      border-left-color: var(--link);
      text-decoration: none;
    }
    #pl a.act {
      font-weight: 600;
    }
    #sb footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--bd);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    #sb footer button {
      flex: 1;
      padding: 6px 10px;
      background: var(--btn);
      color: var(--btn-c);
      border: 0;
      border-radius: var(--btn-r);
    }

    /* Storage status pill (sidebar) */
    #fss {
      flex: 1 0 100%;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 2px 0;
      cursor: pointer;
      background: 0 0;
      border: 0;
      text-align: left;
    }
    #fss .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--muted);
    }
    #fss.s-ok .dot {
      background: var(--ok);
    }
    #fss.s-warn .dot {
      background: #f59e0b;
    }
    #fss.s-err .dot {
      background: var(--err);
    }
    #fss .txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Storage warning banner (top of main) */
    #fsb {
      border: 1px solid #f59e0b;
      background: #fffbeb;
      color: #78350f;
      border-radius: var(--btn-r);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    #fsb.b-err {
      border-color: var(--err);
      background: #fef2f2;
      color: #7f1d1d;
    }
    #fsb strong {
      display: block;
      margin-bottom: 0.25rem;
    }
    #fsb .b-a {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Settings: storage block */
    #set .fs-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--bd);
      border-radius: var(--btn-r);
      background: var(--sb-bg);
    }
    #set .fs-box h3 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    #set .fs-box p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 0.5rem;
    }
    #set .fs-box code {
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    #set .fs-box .fs-a {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    /* Main content */
    #main {
      flex: 1;
      margin-left: var(--sb-w);
      padding: 2rem;
      max-width: 960px;
      min-height: 100vh;
    }
    #main h1 {
      font-size: var(--h1);
      margin: var(--h-mg);
    }
    #main h2 {
      font-size: var(--h2);
      margin: var(--h-mg);
    }
    #main h3 {
      font-size: var(--h3);
      margin: var(--h-mg);
    }
    #main h4 {
      margin: var(--h-mg);
    }
    #main p {
      margin: 0.5rem 0;
      line-height: 1.6;
    }
    #main ul,
    #main ol {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
    }
    #main li {
      margin: 0.25rem 0;
    }
    #main li.t {
      list-style: none;
      margin-left: -1.5rem;
    }
    #main li.t input[type="checkbox"] {
      width: auto;
      margin-right: 0.4rem;
    }
    #main table {
      border-collapse: collapse;
      margin: 0.5rem 0;
      width: 100%;
    }
    #main th,
    #main td {
      border: 1px solid var(--bd);
      padding: 6px 10px;
      text-align: left;
    }
    #main th {
      background: var(--sb-bg);
      font-weight: 600;
    }
    #main blockquote {
      border-left: 3px solid var(--link);
      padding: 0.25rem 1rem;
      margin: 0.5rem 0;
      color: var(--muted);
      background: rgba(37, 99, 235, 0.04);
    }
    #main pre {
      background: #f8f8f8;
      border: 1px solid var(--bd);
      border-radius: var(--btn-r);
      padding: 0.75rem 1rem;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    #main code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
    }
    #main pre code {
      background: 0 0;
      padding: 0;
    }
    #main hr {
      border: 0;
      border-top: 2px solid var(--bd);
      margin: 1.5rem 0;
    }
    #main img {
      max-width: 100%;
      height: auto;
      border-radius: var(--btn-r);
    }

    /* Buttons inside main */
    .btn {
      padding: 8px 16px;
      border: 0;
      border-radius: var(--btn-r);
      cursor: pointer;
      font-size: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-p {
      background: var(--btn);
      color: var(--btn-c);
    }
    .btn-d {
      background: var(--err);
      color: #fff;
    }
    .btn-o {
      background: 0 0;
      border: 1px solid var(--bd);
      color: var(--color);
    }
    .btn-s {
      background: var(--ok);
      color: #fff;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 0.85rem;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* Page list items */
    .pg-e {
      padding: 0.75rem 1rem;
      border: 1px solid var(--bd);
      border-radius: var(--btn-r);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .pg-e:hover {
      background: var(--sb-bg);
    }
    .pg-e .pg-t {
      flex: 1;
      overflow: hidden;
    }
    .pg-e .pg-t a {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .pg-e .pg-t .pg-d {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .pg-e .pg-s,
    .pg-e .pg-x {
      background: 0 0;
      border: 0;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 1rem;
    }
    .pg-e .pg-s:hover,
    .pg-e .pg-x:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    /* Editor */
    #ed-s {
      display: flex;
      gap: 1rem;
      min-height: 60vh;
      margin-top: 1rem;
    }
    #ed-s textarea,
    #ed-s #ed-p {
      flex: 1;
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--bd);
      border-radius: var(--btn-r);
    }
    #ed-s textarea {
      resize: none;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.5;
      tab-size: 2;
    }
    #ed-s #ed-p {
      overflow-y: auto;
      background: var(--bg);
    }
    #ed-s #ed-p > :first-child {
      margin-top: 0;
    }
    #ed-h {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--bd);
      margin-bottom: 1rem;
    }
    #ed-h .ed-st {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }
    /* Editor Toolbar */
    #ed-tb {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      padding: 6px 0;
      border-bottom: 1px solid var(--bd);
      margin-bottom: 0;
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    #ed-tb button {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      padding: 3px 7px;
      font-size: 0.85rem;
      line-height: 1.2;
      color: var(--color);
      white-space: nowrap;
    }
    #ed-tb button:hover {
      background: rgba(0, 0, 0, 0.06);
      border-color: var(--bd);
    }
    #ed-tb button:active {
      background: rgba(0, 0, 0, 0.1);
    }
    #ed-tb .tb-s {
      border-left: 1px solid var(--bd);
      width: 0;
      padding: 0;
      margin: 2px 3px;
      height: 1.2rem;
    }
    #ed-tb .tb-lbl {
      font-size: 0.65rem;
      color: var(--muted);
      padding: 3px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Status bar */
    #st {
      position: fixed;
      bottom: 0;
      left: var(--sb-w);
      right: 0;
      padding: 4px 1rem;
      font-size: 0.8rem;
      text-align: center;
      z-index: 20;
      transition: opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }
    #st.sh {
      opacity: 1;
    }
    #st.st-ok {
      background: var(--ok);
      color: #fff;
    }
    #st.st-err {
      background: var(--err);
      color: #fff;
    }
    #st.st-info {
      background: var(--link);
      color: #fff;
    }

    /* Search */
    #sr {
      padding: 0.5rem 0;
    }
    #sr .sr-r {
      padding: 6px 0;
      border-bottom: 1px solid var(--bd);
    }
    #sr .sr-r:last-child {
      border: 0;
    }
    #sr .sr-r a {
      font-weight: 600;
    }
    #sr .sr-r .sr-ex {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }
    #sr .sr-r .sr-ex em {
      background: #fef08a;
      font-style: normal;
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* Settings */
    #set label {
      display: block;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }
    #set input,
    #set textarea {
      max-width: 500px;
    }
    #set textarea {
      min-height: 80px;
      resize: vertical;
    }
    #set .imp {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--bd);
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    #set .imp a {
      color: var(--muted);
      text-decoration: underline;
    }
    #set .imp a:hover {
      color: var(--link);
    }

    /* Empty state */
    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    /* Notifications */
    #noti {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #noti > div {
      padding: 0.75rem 1rem;
      border-radius: var(--btn-r);
      color: #fff;
      animation: n 0.3s ease;
      max-width: 350px;
    }
    #noti > div.n-ok {
      background: var(--ok);
    }
    #noti > div.n-err {
      background: var(--err);
    }
    #noti > div.n-info {
      background: var(--link);
    }
    @keyframes n {
      from {
        opacity: 0;
        transform: translateX(1rem);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Modal overlay */
    #mo {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mo > div {
      background: var(--bg);
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }
    #mo h3 {
      margin-bottom: 1rem;
    }
    #mo .mo-b {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    /* Responsive */
    @media (max-width: 700px) {
      #sb {
        position: fixed;
        width: 100%;
        height: auto;
        bottom: auto;
        border-right: 0;
        border-bottom: 1px solid var(--bd);
        flex-direction: row;
        align-items: center;
        padding: 0.5rem 1rem;
        z-index: 50;
      }
      #sb header {
        padding: 0;
        border: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #sb header h1 {
        font-size: 1rem;
      }
      #sb #s-i {
        margin: 0;
        width: auto;
        flex: 1;
      }
      #pl,
      #sb footer {
        display: none;
      }
      #main {
        margin-left: 0;
        margin-top: 3.5rem;
        padding: 1rem;
      }
      #st {
        left: 0;
      }
      #ed-s {
        flex-direction: column;
      }
      #ed-s textarea,
      #ed-s #ed-p {
        min-height: 40vh;
      }
    }
  </style>

  <div id="sb">
    <header>
      <h1><a href="?" id="wt">Wiki</a></h1>
      <input id="s-i" type="search" placeholder="Suche…" autocomplete="off" />
    </header>
    <nav id="pl"></nav>
    <footer>
      <button id="bn">+ Neue Seite</button>
      <button id="bs">⚙ Einstellungen</button>
      <button id="fss" type="button" title="Speicher-Status">
        <span class="dot"></span><span class="txt">Speicher wird geprüft…</span>
      </button>
    </footer>
  </div>

  <main id="main"></main>
  <div id="st"></div>
  <div id="noti"></div>

  <script>
    // ═══════════════════════════════════════════
    // LIB: Event Emitter
    // ═══════════════════════════════════════════
    const EE = new (class {
      constructor() {
        this._e = {};
      }
      on(e, f) {
        (this._e[e] = this._e[e] || []).push(f);
      }
      off(e, f) {
        const l = this._e[e];
        l && (this._e[e] = l.filter((i) => i !== f));
      }
      emit(e, ...a) {
        (this._e[e] || []).forEach((f) => f(...a));
      }
    })();

    // ═══════════════════════════════════════════
    // LIB: Storage
    //   Primär   : JSON-Datei in einem vom Nutzer gewählten Ordner
    //              (File System Access API — Chromium/Edge)
    //   Sekundär : localStorage als schneller Cache + Fallback
    //
    // Warum: localStorage gehört dem Browser-Profil. Ein zurückgesetztes
    // Windows-Profil (RDP!), eine Richtlinie "Website-Daten beim Schließen
    // löschen" oder das Aufräumen durch den Browser löschen alles — ohne
    // Vorwarnung und ohne Datei, die man hätte sichern können. Eine echte
    // Datei auf der Platte übersteht das und lässt sich kopieren.
    // (Der Pfad der HTML-Datei ist dabei egal: Chromium fasst alle
    // file://-Seiten zu einer einzigen Origin zusammen.)
    // ═══════════════════════════════════════════
    const FS_OK = typeof window.showDirectoryPicker === "function";
    const DATA_FILE = "wiki-data.json";
    const BACKUP_DIR = "backups";
    const BACKUP_KEEP = 14;
    const DEF_META = { title: "Mein Wiki", description: "" };

    // Merkt sich den Ordner-Handle über Sitzungen hinweg (nur IndexedDB
    // kann FileSystemHandles speichern, localStorage kann das nicht).
    const HDB = {
      _p: null,
      _open() {
        if (!this._p)
          this._p = Promise.race([
            new Promise((res, rej) => {
              const r = indexedDB.open("wiki_fs", 1);
              r.onupgradeneeded = () => r.result.createObjectStore("h");
              r.onsuccess = () => res(r.result);
              r.onerror = () => rej(r.error);
              r.onblocked = () => rej(new Error("blocked"));
            }),
            // IndexedDB kann unter file:// in manchen Profilen weder
            // success noch error feuern und würde ewig hängen.
            new Promise((res) => setTimeout(() => res(null), 3000)),
          ]).catch(() => null);
        return this._p;
      },
      async get(k) {
        const db = await this._open();
        if (!db) return null;
        return new Promise((res) => {
          try {
            const q = db.transaction("h", "readonly").objectStore("h").get(k);
            q.onsuccess = () => res(q.result || null);
            q.onerror = () => res(null);
          } catch (e) {
            res(null);
          }
        });
      },
      async set(k, v) {
        const db = await this._open();
        if (!db) return;
        return new Promise((res) => {
          try {
            const q = db
              .transaction("h", "readwrite")
              .objectStore("h")
              .put(v, k);
            q.onsuccess = q.onerror = () => res();
          } catch (e) {
            res();
          }
        });
      },
      async del(k) {
        const db = await this._open();
        if (!db) return;
        return new Promise((res) => {
          try {
            const q = db
              .transaction("h", "readwrite")
              .objectStore("h")
              .delete(k);
            q.onsuccess = q.onerror = () => res();
          } catch (e) {
            res();
          }
        });
      },
    };

    const ST = {
      _pages: [],
      _meta: { ...DEF_META },
      KEY: "wiki_data",
      dir: null, // FileSystemDirectoryHandle, wenn verbunden
      pending: null, // Handle, der noch eine Freigabe per Klick braucht
      state: "warn", // ok | warn | err — für Statusanzeige
      note: "", // Klartext für Statusanzeige
      _wTm: null,
      _writing: false,
      _again: false,
      _bkDay: null,

      // ---- Serialisierung -------------------------------------------
      snapshot() {
        return {
          version: 2,
          savedAt: Date.now(),
          meta: this._meta,
          pages: this._pages,
        };
      },
      // Mutiert in-place, damit Referenzen (A.p / A.m) gültig bleiben.
      _apply(d) {
        const pages = Array.isArray(d && d.pages) ? d.pages : [];
        this._pages.length = 0;
        this._pages.push(...pages);
        Object.assign(this._meta, DEF_META, (d && d.meta) || {});
      },

      // ---- localStorage ---------------------------------------------
      _readLocal() {
        try {
          const raw = localStorage.getItem(this.KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      },
      _writeLocal(snap) {
        try {
          localStorage.setItem(this.KEY, JSON.stringify(snap));
          return true;
        } catch (e) {
          console.error("localStorage", e);
          return false;
        }
      },

      // ---- Datei ----------------------------------------------------
      async _readFile(dir) {
        try {
          const fh = await dir.getFileHandle(DATA_FILE);
          const txt = await (await fh.getFile()).text();
          return txt.trim() ? JSON.parse(txt) : null;
        } catch (e) {
          // NotFoundError = Datei gibt es noch nicht → kein Fehler
          if (e.name !== "NotFoundError") console.error("readFile", e);
          return null;
        }
      },
      async _writeFile() {
        if (!this.dir) return;
        if (this._writing) {
          this._again = true;
          return;
        }
        this._writing = true;
        try {
          const json = JSON.stringify(this.snapshot(), null, 2);
          // Chrome schreibt in eine Swap-Datei und benennt bei close()
          // atomar um — ein Abbruch mittendrin zerstört die alte Datei nicht.
          const fh = await this.dir.getFileHandle(DATA_FILE, { create: true });
          const w = await fh.createWritable();
          await w.write(json);
          await w.close();
          await this._backup(json);
          this.setState("ok", this.dir.name + "/" + DATA_FILE);
        } catch (e) {
          console.error("writeFile", e);
          this.setState(
            "err",
            "Datei nicht schreibbar: " + (e.message || e.name),
          );
        } finally {
          this._writing = false;
          if (this._again) {
            this._again = false;
            this._writeFile();
          }
        }
      },
      // Eine Sicherung pro Tag — bewusst beim ersten Speichern der
      // Sitzung, damit sie den Stand *vor* heutigen Änderungen festhält.
      async _backup(json) {
        const day = new Date().toISOString().slice(0, 10);
        if (this._bkDay === day) return;
        try {
          const bd = await this.dir.getDirectoryHandle(BACKUP_DIR, {
            create: true,
          });
          const fh = await bd.getFileHandle("wiki-" + day + ".json", {
            create: true,
          });
          const w = await fh.createWritable();
          await w.write(json);
          await w.close();
          this._bkDay = day;
          // Alte Sicherungen aufräumen (ISO-Datum → alphabetisch = chronologisch)
          const names = [];
          for await (const n of bd.keys())
            if (/^wiki-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
          names.sort();
          for (const n of names.slice(0, Math.max(0, names.length - BACKUP_KEEP)))
            await bd.removeEntry(n).catch(() => {});
        } catch (e) {
          console.error("backup", e);
        }
      },

      // ---- Verbinden ------------------------------------------------
      // Vergleicht Datei- und Browser-Stand. Im Normalfall gewinnt der
      // neuere. Würde der Browser-Stand aber Seiten aus der Datei
      // wegwerfen, wird vorher gefragt — und die Datei in jedem Fall
      // zuerst weggesichert.
      async _attach(dir) {
        this.dir = dir;
        this.pending = null;
        const local = this._readLocal();
        const file = await this._readFile(dir);
        const lT = (local && local.savedAt) || 0;
        const fT = (file && file.savedAt) || 0;
        const lN = (local && local.pages && local.pages.length) || 0;
        const fN = (file && file.pages && file.pages.length) || 0;

        let useFile = !!file && (fT >= lT || lN === 0);
        // Der Browser-Stand ist zwar neuer, hätte aber weniger Seiten:
        // das ist genau das Muster eines geleerten Browser-Speichers.
        if (file && !useFile && fN > lN) {
          useFile = confirm(
            `Unterschiedliche Stände gefunden:\n\n` +
              `• Datei ${DATA_FILE}: ${fN} Seiten (${fT ? date(fT) : "unbekannt"})\n` +
              `• Browser-Speicher: ${lN} Seiten (${lT ? date(lT) : "unbekannt"})\n\n` +
              `Den Stand aus der DATEI verwenden? (empfohlen — er hat mehr Seiten)\n` +
              `Abbrechen behält den Browser-Stand.`,
          );
        }

        if (useFile) {
          this._apply(file);
          this._writeLocal(this.snapshot());
          this.setState("ok", dir.name + "/" + DATA_FILE);
          noti(`Datenordner verbunden — ${fN} Seiten aus ${DATA_FILE}`, "ok");
        } else {
          // Bestehende Datei zuerst wegsichern, bevor sie ersetzt wird.
          if (file) await this._snapshotFile(dir, file);
          if (local) this._apply(local);
          await this._writeFile();
          noti(
            file
              ? `Datenordner verbunden — ${lN} Seiten aus dem Browser übernommen, der vorherige Dateistand liegt in ${BACKUP_DIR}/`
              : `Datenordner verbunden — ${lN} Seiten in ${DATA_FILE} gesichert`,
            "ok",
            6000,
          );
        }
        EE.emit("reload");
      },
      // Sicherheitskopie des Dateistands, bevor er überschrieben wird
      async _snapshotFile(dir, snap) {
        try {
          const bd = await dir.getDirectoryHandle(BACKUP_DIR, { create: true });
          const name =
            "vor-ueberschreiben-" +
            new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) +
            ".json";
          const fh = await bd.getFileHandle(name, { create: true });
          const w = await fh.createWritable();
          await w.write(JSON.stringify(snap, null, 2));
          await w.close();
        } catch (e) {
          console.error("snapshotFile", e);
        }
      },

      async connect() {
        if (!FS_OK)
          return noti(
            "Dieser Browser unterstützt keinen Datei-Speicher. Bitte Microsoft Edge oder Google Chrome verwenden.",
            "err",
            6000,
          );
        try {
          const dir = await window.showDirectoryPicker({
            id: "wikiData",
            mode: "readwrite",
          });
          await HDB.set("dir", dir);
          await this._attach(dir);
        } catch (e) {
          if (e.name !== "AbortError")
            noti("Ordner konnte nicht verbunden werden: " + e.message, "err");
        }
      },
      // Nach Browser-Neustart ist der Handle da, aber die Freigabe muss
      // per Klick erneuert werden (Browser-Sicherheitsregel).
      async reconnect() {
        const dir = this.pending || (await HDB.get("dir"));
        if (!dir) return this.connect();
        try {
          const p = await dir.requestPermission({ mode: "readwrite" });
          if (p !== "granted")
            return noti("Zugriff auf den Datenordner verweigert", "err");
          await this._attach(dir);
        } catch (e) {
          noti("Zugriff fehlgeschlagen: " + e.message, "err");
        }
      },
      async disconnect() {
        await HDB.del("dir");
        this.dir = null;
        this.pending = null;
        this.setState("warn", "");
        noti("Datenordner getrennt — es wird nur noch im Browser gespeichert", "info");
        EE.emit("reload");
      },

      // ---- Start ----------------------------------------------------
      // Bewusst zweigeteilt: der synchrone Teil reicht, um die App
      // anzuzeigen. Das Anbinden der Datei läuft danach im Hintergrund —
      // so bleibt das Wiki auch dann bedienbar, wenn der Ordner weg ist
      // oder IndexedDB klemmt.
      bootLocal() {
        this._apply(this._readLocal() || {});
        return this;
      },
      async bootFile() {
        try {
          if (!FS_OK)
            return this.setState(
              "warn",
              "Browser ohne Datei-Speicher (Edge/Chrome empfohlen)",
            );
          const dir = await HDB.get("dir");
          if (!dir) return this.setState("warn", "Kein Datenordner verbunden");
          const p = await dir.queryPermission({ mode: "readwrite" });
          if (p === "granted") await this._attach(dir);
          else {
            this.pending = dir;
            this.setState("warn", "Datenordner „" + dir.name + "“ freigeben");
            render();
          }
        } catch (e) {
          console.error("bootFile", e);
          this.setState("warn", "Datenordner nicht erreichbar");
          render();
        }
      },

      setState(s, note) {
        this.state = s;
        this.note = note || "";
        renderFsStatus();
      },

      // ---- API (unverändert für den Rest der App) -------------------
      save() {
        const snap = this.snapshot();
        this._writeLocal(snap);
        if (this.dir) {
          clearTimeout(this._wTm);
          this._wTm = setTimeout(() => this._writeFile(), 400);
        }
      },
      async flush() {
        clearTimeout(this._wTm);
        this._writeLocal(this.snapshot());
        if (this.dir) await this._writeFile();
      },
      getAllPages() {
        return this._pages;
      },
      getPage(id) {
        return this._pages.find((p) => p.id === id) || null;
      },
      putPage(p) {
        p.updated = Date.now();
        const i = this._pages.findIndex((x) => x.id === p.id);
        if (i > -1) this._pages[i] = p;
        else this._pages.push(p);
        this.save();
      },
      delPage(id) {
        const i = this._pages.findIndex((x) => x.id === id);
        if (i > -1) this._pages.splice(i, 1);
        this.save();
      },
      getMeta() {
        return this._meta;
      },
      putMeta(v) {
        if (v !== this._meta) Object.assign(this._meta, v);
        this.save();
      },
    };

    // ═══════════════════════════════════════════
    // LIB: Markdown Parser
    // ═══════════════════════════════════════════
    function md(t) {
      if (!t) return "";
      const es = (text) =>
        text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      let html = [],
        codeBlocks = [],
        id = 0;
      // Extract code blocks
      t = t.replace(/```(\w*)\n?([\s\S]*?)```/gm, (_, l, c) => {
        const n = id++;
        codeBlocks[n] = { lang: l, code: c.replace(/^`*|`*$/g, "") };
        return `\x00CODE${n}\x00`;
      });
      // Extract inline HTML tags
      t = t.replace(/<\/?[a-zA-Z][^>]*>/g, (m) => {
        const n = id++;
        html[n] = m;
        return `\x00HTML${n}\x00`;
      });
      // Blockquotes — handle before HTML escaping (> would become &gt;)
      t = t.replace(/^>\s+(.*)$/gm, "<blockquote>$1</blockquote>");
      t = t.replace(/<\/blockquote>\n<blockquote>/g, "\n");
      // Protect blockquote tags from escaping
      t = t.replace(/<\/?blockquote>/g, (m) => {
        const n = id++;
        html[n] = m;
        return `\x00HTML${n}\x00`;
      });
      // Escape HTML except our markers
      t = es(t);
      // Restore HTML markers
      t = t.replace(/\x00HTML(\d+)\x00/g, (_, n) => html[+n]);
      // Headings
      t = t.replace(
        /^(#{1,6})\s+(.*)$/gm,
        (_, h, text) => `<h${h.length}>${text.trim()}</h${h.length}>`,
      );
      // Bold/Italic/Strikethrough (order: *** before ** before *)
      t = t.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
      t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/\*(.+?)\*/g, "<em>$1</em>");
      t = t.replace(/~~(.+?)~~/g, "<del>$1</del>");
      // Images & links
      t = t.replace(
        /!\[([^\]]*)\]\(([^\s)]+)(?:\s+"([^"]*)")?\)/g,
        (_, alt, src, title) =>
          `<img src="${src}" alt="${alt}"${title ? ` title="${title}"` : ""}>`,
      );
      t = t.replace(
        /\[([^\]]*)\]\(([^\s)]+)(?:\s+"([^"]*)")?\)/g,
        (_, text, href, title) =>
          `<a href="${href}"${title ? ` title="${title}"` : ""}>${text}</a>`,
      );
      // Wiki links [[Seite]] or [[text|seite]] — slugify + class for styling
      t = t.replace(
        /\[\[([^\]|]+)\|([^\]]+)\]\]/g,
        (_, text, page) =>
          `<a href="?page=${slugify(page)}" class=wl>${text}</a>`,
      );
      t = t.replace(
        /\[\[([^\]]+)\]\]/g,
        (_, text) => `<a href="?page=${slugify(text)}" class=wl>${text}</a>`,
      );
      // Horizontal rules
      t = t.replace(/^(?:[-*_]){3,}\s*$/gm, "<hr>");
      // Unordered lists
      t = t.replace(/^[\t ]*[-*+]\s+(.*)$/gm, "<li>$1</li>");
      t = t.replace(/(?:<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
      // Ordered lists
      t = t.replace(/^[\t ]*\d+[.)]\s+(.*)$/gm, "<li>$1</li>");
      t = t.replace(/(?:<li>.*?<\/li>\n?)+/g, (m) =>
        /<ul>/.test(m) ? m : `<ol>${m}</ol>`,
      );
      // Fix nested lists
      t = t.replace(/<ul>\s*<li>(\s*<ul>)/g, "<li>$1");
      t = t.replace(/<ol>\s*<li>(\s*<ol>)/g, "<li>$1");
      t = t.replace(/(<\/ul>\s*)<\/li>\s*<\/ul>/g, "$1</ul>");
      t = t.replace(/(<\/ol>\s*)<\/li>\s*<\/ol>/g, "$1</ol>");
      t = t.replace(/<\/ul>\n?<ul>/g, "");
      t = t.replace(/<\/ol>\n?<ol>/g, "");
      t = t.replace(/<ul>\s*<ol>/g, "<ul>");
      t = t.replace(/<\/ol>\s*<\/ul>/g, "</ul>");
      t = t.replace(/<ol>\s*<ul>/g, "<ol>");
      t = t.replace(/<\/ul>\s*<\/ol>/g, "</ol>");
      // Tables — convert | ... | ... | to HTML table
      t = t.replace(/^\|(.+)\|$/gm, (m) => {
        const cells = m
          .slice(1, -1)
          .split("|")
          .map((c) => c.trim());
        return "<tr><td>" + cells.join("</td><td>") + "</td></tr>";
      });
      t = t.replace(/(<tr>.*<\/tr>\n?)+/g, (m) => {
        // Check if first row is a header (contains ---)
        const lines = m.trim().split("\n");
        let header = "";
        let body = m;
        if (lines.length > 1 && /^<tr><td>-{3,}/.test(lines[1])) {
          header = lines[0];
          body = lines.slice(2).join("\n");
          header = header.replace(/<td>/g, "<th>").replace(/<\/td>/g, "<\/th>");
          return (
            "<table><thead>" +
            header +
            "</thead><tbody>" +
            body +
            "</tbody></table>"
          );
        }
        return "<table>" + m + "</table>";
      });
      // Task lists: - [ ] and - [x]
      t = t.replace(
        /<li>\[ \] /g,
        "<li class=t><input type=checkbox disabled> ",
      );
      t = t.replace(
        /<li>\[x\] /g,
        "<li class=t><input type=checkbox disabled checked> ",
      );
      // Inline code
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      // Paragraphs — wrap remaining text blocks
      let lines = t
        .split("\n\n")
        .map((b) => {
          b = b.trim();
          if (!b) return "";
          if (
            /^<(?:h[1-6]|ul|ol|li|blockquote|pre|hr|div|table|img)/.test(b) ||
            (/<\/[a-z]+>$/.test(b) && !/^<(?:p|a|em|strong|code|del)/.test(b))
          )
            return b;
          return `<p>${b.replace(/\n/g, "<br>")}</p>`;
        })
        .join("\n");
      // Restore code blocks
      for (let n = 0; n < codeBlocks.length; n++) {
        const { lang, code } = codeBlocks[n];
        lines = lines.replace(
          `\x00CODE${n}\x00`,
          `<pre><code${lang ? ` class="language-${lang}"` : ""}>${es(code)}</code></pre>`,
        );
      }
      return lines;
    }

    // ═══════════════════════════════════════════
    // APP: Views
    // ═══════════════════════════════════════════
    function render() {
      const q = Object.fromEntries(new URLSearchParams(location.search));
      const main = document.getElementById("main"),
        pl = document.getElementById("pl");
      renderPageList(pl);
      if (q.settings !== void 0) renderSettings(main);
      else if (q.edit !== void 0) renderEditor(main, q.edit);
      else if (q.search !== void 0) renderSearch(main, q.search);
      else if (q.page !== void 0) renderPage(main, q.page);
      else renderAllPages(main);
      // Speicher-Warnung immer ganz oben — die Einstellungen haben ihren
      // eigenen, ausführlicheren Block.
      const b = q.settings === void 0 ? fsBannerHtml() : "";
      if (b) main.insertAdjacentHTML("afterbegin", b);
      renderFsStatus();
    }

    function renderPageList(el) {
      const q = Object.fromEntries(new URLSearchParams(location.search));
      const curPage = q.page || "";
      el.innerHTML =
        A.p

    // Format helper for toolbar buttons
    function fm(type) {
      const ta = document.getElementById("ed-ta");
      if (!ta) return;
      const s = ta.selectionStart,
        e = ta.selectionEnd;
      const sel = ta.value.slice(s, e);
      const pre = ta.value.slice(0, s),
        post = ta.value.slice(e);
      const ins = (before, after, placeholder) => {
        const txt = sel || placeholder;
        ta.value = pre + before + txt + after + post;
        const p = s + before.length;
        ta.selectionStart = p;
        ta.selectionEnd = p + txt.length;
        ta.focus();
        ta.dispatchEvent(new Event("input"));
      };
      const ln = (prefix, placeholder) => {
        const txt = sel || placeholder;
        const before = pre.endsWith("\n") || pre === "" ? "" : "\n";
        const after = post.startsWith("\n") || post === "" ? "" : "\n";
        ta.value = pre + before + prefix + txt + after + post;
        const p = s + before.length + prefix.length;
        ta.selectionStart = p;
        ta.selectionEnd = p + txt.length;
        ta.focus();
        ta.dispatchEvent(new Event("input"));
      };
      switch (type) {
        case "bold":
          ins("**", "**", "fetter Text");
          break;
        case "italic":
          ins("*", "*", "kursiver Text");
          break;
        case "code":
          ins("`", "`", "code");
          break;
        case "pre":
          ins("```\n", "\n```", "code");
          break;
        case "h1":
          ln("# ", "Überschrift");
          break;
        case "h2":
          ln("## ", "Überschrift");
          break;
        case "h3":
          ln("### ", "Überschrift");
          break;
        case "ul":
          ln("- ", "Listenpunkt");
          break;
        case "ol":
          ln("1. ", "Listenpunkt");
          break;
        case "quote":
          ln("> ", "Zitat");
          break;
        case "hr":
          ins("", "", "\n---\n");
          ta.value = pre + "\n---\n" + post;
          ta.selectionStart = ta.selectionEnd = s + 5;
          ta.focus();
          ta.dispatchEvent(new Event("input"));
          break;
        case "link":
          ins("[", "](https://)", "Linktext");
          break;
        case "img":
          ins("![](", ")", "Bild-URL");
          break;
        case "wlink":
          ins("[[", "]]", "Seitenname");
          break;
        case "task":
          ln("- [ ] ", "Aufgabe");
          break;
        case "table":
          ins(
            "",
            "",
            "\n| Spalte 1 | Spalte 2 |\n|----------|----------|\n| Zelle    | Zelle    |",
          );
          ta.value =
            pre +
            "\n| Spalte 1 | Spalte 2 |\n|----------|----------|\n| Zelle    | Zelle    |" +
            post;
          const tp = s + 1;
          ta.selectionStart = tp;
          ta.selectionEnd = tp;
          ta.focus();
          ta.dispatchEvent(new Event("input"));
          break;
      }
    }

    function edT(v) {

    function savePage(silent) {
      if (!A.edits) return;
      const { id, title, slug, content, origContent } = A.edits;
      if (!title.trim()) return noti("Titel darf nicht leer sein", "err");
      const slug2 = slug || slugify(title);
      const existing = A.p.find((p) => p.slug === slug2 && p.id !== id);
      if (existing) return noti("Slug wird bereits verwendet: " + slug2, "err");

      const now = Date.now();
      const page = {
        id: id || "p_" + now + "_" + Math.random().toString(36).slice(2, 6),
        title: title.trim(),
        slug: slug2,
        content: content,
        created: id ? A.p.find((p) => p.id === id)?.created || now : now,
        updated: now,
      };
      ST.putPage(page);
      if (!silent) noti("Gespeichert: " + page.title, "ok");
      st("Gespeichert ✓", "ok");
      const idx = A.p.findIndex((p) => p.id === page.id);
      if (idx > -1) A.p[idx] = page;
      else A.p.push(page);
      A.edits = { ...A.edits, id: page.id, origContent: content };
      if (!id)
        history.replaceState({}, "", "?edit=" + encodeURIComponent(page.slug));
      const pl = document.getElementById("pl");
      if (pl) renderPageList(pl);
    }

      document.body.appendChild(mo);
      document.getElementById("mo-c").onclick = () => {

        A.p = ST.getAllPages();

    }

    function saveSettings() {

      if (!t) return noti("Titel darf nicht leer sein", "err");

      A.m.description = document.getElementById("st-d").value.trim();

    function renderSearch(el, query) {
      document.title = "Suche: " + query + " | " + A.m.title;
      const q = query.toLowerCase();
      const results = [];
      for (const p of A.p) {
        const ti = p.title.toLowerCase().includes(q),
          ci = p.content.toLowerCase().includes(q);
        if (ti || ci) {
          const excerpts = [];
          if (ci) {
            const idx = p.content.toLowerCase().indexOf(q);
            const start = Math.max(0, idx - 40);
            const end = Math.min(p.content.length, idx + q.length + 40);
            excerpts.push("…" + esc(p.content.slice(start, end)) + "…");
          }
          results.push({ page: p, titleMatch: ti, excerpts });
        }
      }
      function escRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      const hl = escRegex(esc(q));
      let html = `<header><h1>Suche: &quot;${esc(query)}&quot;</h1><p style=color:var(--muted)>${results.length} Ergebnis${results.length !== 1 ? "se" : ""}</p></header>`;
      if (!results.length) html += "<div class=empty>Keine Ergebnisse</div>";
      else
        html += `<div id=sr>${results.map((r) => `<div class=sr-r><a href="?page=${encodeURIComponent(r.page.slug)}">${esc(r.page.title)}</a>${r.excerpts.length ? r.excerpts.map((e) => `<div class=sr-ex>${e.replace(new RegExp(hl, "gi"), (m) => `<em>${m}</em>`)}</div>`).join("") : ""}</div>`).join("")}</div>`;
      el.innerHTML = html;
    }

    function expPage(id) {
      const p = A.p.find((x) => x.id === id);
      if (!p) return;
      const blob = new Blob([p.content], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = p.slug + ".md";
      a.click();
      URL.revokeObjectURL(url);
      noti("Exportiert: " + p.slug + ".md", "ok");
    }

    // Vollständige Sicherung: alle Seiten + Einstellungen in einer Datei.
    // Funktioniert in jedem Browser und ist das universelle Sicherheitsnetz.
    function expJson() {
      const snap = ST.snapshot();
      const blob = new Blob([JSON.stringify(snap, null, 2)], {
        type: "application/json",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download =
        "wiki-sicherung-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
      noti(`Sicherung mit ${snap.pages.length} Seiten heruntergeladen`, "ok");
    }

    function impJson() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        let snap;
        try {
          snap = JSON.parse(await file.text());
        } catch (e) {
          return noti("Datei ist kein gültiges JSON", "err");
        }
        if (!Array.isArray(snap.pages))
          return noti("Datei enthält keine Wiki-Sicherung", "err");
        const cur = A.p.length;
        const when = snap.savedAt ? date(snap.savedAt) : "unbekannt";
        if (
          !confirm(
            `Sicherung mit ${snap.pages.length} Seiten (Stand: ${when}) einlesen?\n\n` +
              `Die aktuellen ${cur} Seiten werden dabei ersetzt.`,
          )
        )
          return;
        ST._apply(snap);
        ST.save();
        A.p = ST.getAllPages();
        A.m = ST.getMeta();
        document.getElementById("title").textContent = A.m.title;
        document.getElementById("wt").textContent = A.m.title;
        noti(snap.pages.length + " Seiten wiederhergestellt", "ok");
        nav("?");
      };
      input.click();
    }

    async function expAllZip() {
      if (A.p.length === 0) return noti("Keine Seiten zum Exportieren", "err");
      if ("showDirectoryPicker" in window) {
        await expAllDir();
        return;
      }
      for (const p of A.p) {
        const blob = new Blob([p.content], { type: "text/markdown" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = p.slug + ".md";
        a.click();
        URL.revokeObjectURL(url);
        await new Promise((r) => setTimeout(r, 200));
      }
      noti(A.p.length + " Seiten exportiert", "ok");
    }

    async function expAllDir() {
      if (!("showDirectoryPicker" in window)) {
        noti(
          "File System API wird von diesem Browser nicht unterstützt",
          "err",
        );
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker({
          mode: "readwrite",
        });
        for (const p of A.p) {
          const fileHandle = await dirHandle.getFileHandle(p.slug + ".md", {
            create: true,
          });
          const writable = await fileHandle.createWritable();
          await writable.write(p.content);
          await writable.close();
        }
        noti(A.p.length + " Seiten in Ordner exportiert", "ok");
      } catch (e) {
        if (e.name !== "AbortError")
          noti("Export fehlgeschlagen: " + e.message, "err");
      }
    }

    async function impFiles() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".md,.markdown";
      input.multiple = true;
      input.onchange = async () => {
        const files = Array.from(input.files);
        let count = 0;
        for (const file of files) {
          const content = await file.text();
          const name = file.name.replace(/\.(md|markdown)$/i, "");
          let title = name;
          const hMatch = content.match(/^#\s+(.+)$/m);
          if (hMatch) title = hMatch[1].trim();
          const slug = slugify(name);
          const existing = A.p.find((p) => p.slug === slug);
          if (existing) {
            if (
              !confirm(
                'Seite "' + title + '" existiert bereits. Überschreiben?',
              )
            )
              continue;
            existing.content = content;
            existing.title = title;
            existing.updated = Date.now();
            ST.putPage(existing);
          } else {
            const page = {
              id:
                "p_" +
                Date.now() +
                "_" +
                Math.random().toString(36).slice(2, 6),
              title,
              slug,
              content,
              created: Date.now(),
              updated: Date.now(),
            };
            ST.putPage(page);
          }
          count++;
        }
        A.p = ST.getAllPages();
        noti(count + " Seiten importiert", "ok");
        render();
      };
      input.click();
    }

    // ═══════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    function slugify(s) {
      return (
        s
          .toLowerCase()
          .replace(/[^a-z0-9äöüß\s-]/g, "")
          .replace(/[\s]+/g, "-")
          .replace(/^-+|-+$/g, "") || "seite"
      );
    }
    function date(ts) {
      return new Date(ts).toLocaleDateString("de-DE", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      const inEditor =
        document.activeElement && document.activeElement.id === "ed-ta";
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        if (A.edits) savePage();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "b" && inEditor) {
        e.preventDefault();
        fm("bold");
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "i" && inEditor) {
        e.preventDefault();
        fm("italic");
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "k" && inEditor) {
        e.preventDefault();
        fm("link");
      }
    });

    // Beforeunload protection
    window.addEventListener("beforeunload", (e) => {
      if (A.edits && A.edits.content !== A.edits.origContent) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    // Ausstehendes Schreiben abschließen, bevor der Tab in den Hintergrund
    // geht oder geschlossen wird — "hidden" ist der letzte Zeitpunkt, an dem
    // asynchrone Arbeit noch zuverlässig durchläuft.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") ST.flush();
    });
    window.addEventListener("pagehide", () => ST.flush());

    // ═══════════════════════════════════════════
    // Sidebar buttons
    // ═══════════════════════════════════════════
    document.addEventListener("DOMContentLoaded", () => {
      document
        .getElementById("bn")
        .addEventListener("click", () => nav("?edit="));
      document
        .getElementById("bs")
        .addEventListener("click", () => nav("?settings"));
      // Statusanzeige: verbinden bzw. freigeben direkt per Klick
      document.getElementById("fss").addEventListener("click", () => {
        if (ST.state === "ok") nav("?settings");
        else if (ST.pending) ST.reconnect();
        else ST.connect();
      });
      renderFsStatus();
    });

    // Nach dem Verbinden/Trennen sind _pages/_meta neu befüllt → neu aufbauen
    EE.on("reload", () => {
      A.p = ST.getAllPages();
      A.m = ST.getMeta();
      const t = document.getElementById("title");
      if (t) t.textContent = A.m.title;
      const w = document.getElementById("wt");
      if (w) w.textContent = A.m.title;
      render();
      seedHelp(); // falls der frisch verbundene Ordner noch leer war
    });

    // ═══════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════
    function init() {
      ST.bootLocal();
      A.p = ST.getAllPages();
      A.m = ST.getMeta();
      document.getElementById("title").textContent = A.m.title;
      document.getElementById("wt").textContent = A.m.title;
      render();
      // Datei-Speicher im Hintergrund anbinden; erst danach entscheiden,
      // ob wirklich noch nichts da ist — sonst würde die Hilfeseite einen
      // vorhandenen Dateistand als "neuer" verdrängen.
      ST.bootFile().then(seedHelp, seedHelp);
    }

    // Beim allerersten Start eine Hilfeseite anlegen. Nicht, solange ein
    // Datenordner noch auf seine Freigabe wartet — dort liegen womöglich
    // schon Seiten, die sonst mit der Hilfeseite kollidieren würden.
    function seedHelp() {
      if (ST.getAllPages().length || ST.pending) return;
      {
        const help = {
          id: "p_help",
          title: "📖 Hilfe & Bedienung",
          slug: "hilfe",
          content: `# 📖 Hilfe & Bedienung

Willkommen beim **Bettina Wiki**! Diese Seite erklärt dir die wichtigsten Funktionen.

---

## ➕ Seiten erstellen

Klicke unten in der Seitenleiste auf **+ Neue Seite**.
Gib einen **Titel** und optional einen **Slug** (URL-Name) ein.
Schreibe den Inhalt in **Markdown** – die Vorschau rechts zeigt live, wie es später aussieht.
Klicke auf **💾 Speichern**.

## ✏️ Seiten bearbeiten

Auf jeder Seite gibt es oben rechts den **✏️ Bearbeiten**-Button.
Auch in der Seitenliste kannst du über den ✏️-Button direkt in den Editor springen.

## 🔗 Wiki-Links

Mit \`[[Seitenname]]\` erzeugst du einen internen Link zu einer anderen Wiki-Seite.
Mit \`[[Text|seite]]\` kannst du einen abweichenden Anzeigetext festlegen.

Noch nicht existierende Seiten werden beim Anklicken automatisch zur Neuanlage angeboten.

## 🔍 Suchen

Das Suchfeld in der Seitenleiste durchsucht **Titel und Inhalt** aller Seiten.
Treffer werden mit gelbem Hintergrund hervorgehoben.
Die Suche startet automatisch 300 ms nach dem letzten Tastendruck.

## ⌨️ Tastaturkürzel

| Kürzel           | Aktion                 |
| ---------------- | ---------------------- |
| \`Strg+S\`       | Seite speichern        |
| \`Strg+B\`       | **Fett**               |
| \`Strg+I\`       | *Kursiv*               |
| \`Strg+K\`       | Link einfügen          |

Alle Kürzel funktionieren nur, wenn der Fokus im Editor ist.

## 🎨 Formatierungsleiste

Im Editor findest du eine **Toolbar** mit Buttons für:
**Fett**, *Kursiv*, Code, Überschriften (H1–H3), Listen, Checkboxen, Zitate, Trennlinien, Tabellen, Code-Blöcke, Links, Bilder und Wiki-Links.

Die Toolbar bleibt beim Scrollen **am oberen Rand kleben** – so hast du sie immer griffbereit.

## 📥 Export / 📤 Import

In den **Einstellungen** (⚙) findest du:

- **📥 .md** – Einzelne Seite als Markdown-Datei herunterladen
- **📦 Alle exportieren** – Alle Seiten als einzelne Downloads
- **📁 In Ordner exportieren** – In einen lokalen Ordner speichern (Chromium)
- **📂 .md importieren** – Eine oder mehrere \`.md\`-Dateien importieren

## ⚙️ Einstellungen

Über den ⚙-Button in der Seitenleiste erreichst du die Einstellungen.
Dort kannst du **Titel** und **Beschreibung** des Wikis ändern.

## 💾 Autosave

Der Editor speichert **automatisch 800 ms** nach der letzten Eingabe.
Zusätzlich warnt dich der Browser, wenn du die Seite mit ungespeicherten Änderungen verlassen willst.

## 🔒 Wo liegen meine Daten? (wichtig!)

Ohne Datenordner liegen alle Seiten **nur im Browser-Speicher**. Der kann
jederzeit verschwinden – durch „Browserdaten löschen", ein zurückgesetztes
Windows-Profil (z.B. bei Remote-Desktop) oder wenn der Browser selbst aufräumt.
Und zwar ohne Vorwarnung, weil es keine Datei gibt, die man hätte sichern können.

Deshalb: **einmalig einen Datenordner verbinden.**
Einstellungen (⚙) → **📁 Datenordner wählen**. Danach schreibt das Wiki alles in
eine echte Datei \`wiki-data.json\` und legt im Unterordner \`backups/\` täglich
eine Sicherung an.

Am besten einen Ordner in **OneDrive** o.ä. wählen – dann gibt es zusätzlich
Versionierung und eine Kopie in der Cloud.

Links unten in der Seitenleiste zeigt ein Punkt den Status:
🟢 Datei-Speicher aktiv · 🟡 nur Browser-Speicher (Klick verbindet den Ordner).

Nach einem Browser-Neustart fragt der Browser aus Sicherheitsgründen einmal
nach – ein Klick auf **Jetzt freigeben** genügt.

Zusätzlich gibt es in den Einstellungen **💾 Vollständige Sicherung (.json)** –
eine einzelne Datei mit allen Seiten und Einstellungen, die sich über
**♻️ Sicherung wiederherstellen** jederzeit wieder einlesen lässt.

---

Viel Spaß mit deinem Wiki! 🎉`,
          created: Date.now(),
          updated: Date.now(),
        };
        ST.putPage(help);
        A.p = ST.getAllPages();
        render();
      }
    }
    init();
  </script>
</html>
